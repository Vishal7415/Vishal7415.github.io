<svg viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients for Light Mode -->
    <radialGradient id="bgGradientLight1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bgGradientLight2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <!-- ASCII Gradient Animation (Light Mode) -->
    <linearGradient id="asciiGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="50%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#10B981"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100%;0%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Accent Gradient Light -->
    <linearGradient id="accentGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>

    <!-- Glow Filter Light -->
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Glow Filter for ASCII Light -->
    <filter id="strongGlowLight">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Effect -->
    <pattern id="scanlinesLight" x="0" y="0" width="100%" height="2" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="100%" y2="1" stroke="rgba(0,0,0,0.02)" stroke-width="1"/>
    </pattern>

    <!-- Noise Texture Light -->
    <filter id="noiseLight">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" seed="2"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="noise" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <!-- Clipping paths -->
    <clipPath id="leftClipLight">
      <rect x="0" y="0" width="450" height="610" rx="20"/>
    </clipPath>
    <clipPath id="rightClipLight">
      <rect x="450" y="0" width="730" height="610" rx="20"/>
    </clipPath>

    <!-- Particle Animation Light -->
    <g id="particleLight">
      <circle r="1" fill="url(#accentGradientLight)" opacity="0.4"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
    </g>
  </defs>

  <!-- Background Light -->
  <rect width="1180" height="610" fill="#FFFFFF"/>
  <rect width="1180" height="610" fill="url(#bgGradientLight1)"/>
  <rect width="1180" height="610" fill="url(#bgGradientLight2)"/>

  <!-- Floating Particles Background -->
  <use href="#particleLight" x="150" y="100">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#pathL1"/>
    </animateMotion>
  </use>
  <path id="pathL1" d="M 150 100 Q 200 50 250 100 Q 200 150 150 100" fill="none" opacity="0"/>

  <use href="#particleLight" x="1050" y="500">
    <animateMotion dur="10s" repeatCount="indefinite">
      <mpath href="#pathL2"/>
    </animateMotion>
  </use>
  <path id="pathL2" d="M 1050 500 Q 1000 450 950 500 Q 1000 550 1050 500" fill="none" opacity="0"/>

  <!-- Main Container with rounded corners -->
  <g clip-path="url(#leftClipLight)">
    <!-- Left Side Background -->
    <rect x="0" y="0" width="450" height="610" fill="#FFFFFF" rx="20"/>
    <rect x="0" y="0" width="450" height="610" fill="rgba(37,99,235,0.03)" rx="20"/>
  </g>

  <g clip-path="url(#rightClipLight)">
    <!-- Right Side Background -->
    <rect x="450" y="0" width="730" height="610" fill="#FFFFFF" rx="20"/>
    <rect x="450" y="0" width="730" height="610" fill="rgba(6,182,212,0.02)" rx="20"/>
  </g>

  <!-- LEFT SIDE: ASCII PORTRAIT -->
  <g clip-path="url(#leftClipLight)">
    <g opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="4s" repeatCount="indefinite"/>

      <!-- ASCII Art with staggered animation -->
      <text x="50" y="80" font-family="monospace" font-size="12" fill="url(#asciiGradientLight)" filter="url(#strongGlowLight)" font-weight="bold">
        <tspan x="50" dy="14">    ╔═══════════╗</tspan>
        <tspan x="50" dy="14">    ║ ▓▒░ DEV ░▒▓ ║</tspan>
        <tspan x="50" dy="14">    ║           ║</tspan>
        <tspan x="50" dy="14">    ║  ⚡ █░░█  ║</tspan>
        <tspan x="50" dy="14">    ║   █▓▓▓█   ║</tspan>
        <tspan x="50" dy="14">    ║   █���▒▓█   ║</tspan>
        <tspan x="50" dy="14">    ║  ⚡ █░░█  ║</tspan>
        <tspan x="50" dy="14">    ║           ║</tspan>
        <tspan x="50" dy="14">    ║ ◆ CODING ◆ ║</tspan>
        <tspan x="50" dy="14">    ╚═══════════╝</tspan>

        <!-- Typing cursor animation -->
        <animate attributeName="stroke" values="none;#06B6D4;none" dur="1s" repeatCount="indefinite"/>
      </text>

      <!-- Glow effect around ASCII -->
      <rect x="30" y="60" width="220" height="200" rx="8" fill="none" stroke="url(#accentGradientLight)" stroke-width="1" opacity="0.2" filter="url(#glowLight)">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
      </rect>

      <!-- Scanline effect -->
      <rect x="30" y="60" width="220" height="200" rx="8" fill="url(#scanlinesLight)" opacity="0.01"/>
    </g>

    <!-- Cyan accent line animation -->
    <line x1="50" y1="350" x2="300" y2="350" stroke="url(#accentGradientLight)" stroke-width="2" opacity="0.2" filter="url(#glowLight)">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- RIGHT SIDE: TERMINAL WINDOW -->
  <g clip-path="url(#rightClipLight)">
    <!-- Terminal Panel -->
    <rect x="480" y="40" width="660" height="530" rx="16" fill="rgba(248,250,252,0.6)" stroke="rgba(15,23,42,0.08)" stroke-width="1.5" filter="url(#noiseLight)">
      <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Terminal Header -->
    <rect x="480" y="40" width="660" height="45" rx="16" fill="rgba(37,99,235,0.05)"/>
    <circle cx="505" cy="62" r="4" fill="#EF4444" opacity="0.6"/>
    <circle cx="525" cy="62" r="4" fill="#FBBF24" opacity="0.6"/>
    <circle cx="545" cy="62" r="4" fill="#10B981" opacity="0.6"/>
    <text x="610" y="68" font-family="monospace" font-size="12" fill="#64748B" text-anchor="middle">~/profile.dev</text>

    <!-- Greeting -->
    <text x="510" y="120" font-family="monospace" font-size="14" fill="#0F172A" font-weight="bold">
      Hi 👋 I'm
      <tspan fill="url(#accentGradientLight)" filter="url(#glowLight)">Vishal</tspan>
    </text>

    <!-- Animated typing text group -->
    <g>
      <!-- Role 1: Frontend Engineer -->
      <text x="510" y="155" font-family="monospace" font-size="13" fill="#06B6D4" filter="url(#glowLight)">
        > Frontend Engineer
        <animate attributeName="opacity" values="0;1;1;1;0" dur="8s" repeatCount="indefinite" begin="0s"/>
      </text>

      <!-- Role 2: Full Stack Developer -->
      <text x="510" y="155" font-family="monospace" font-size="13" fill="#2563EB" filter="url(#glowLight)">
        > Full Stack Developer
        <animate attributeName="opacity" values="0;0;0;1;1;1;0" dur="12s" repeatCount="indefinite" begin="0s"/>
      </text>

      <!-- Role 3: UI Engineer -->
      <text x="510" y="155" font-family="monospace" font-size="13" fill="#10B981" filter="url(#glowLight)">
        > UI Engineer
        <animate attributeName="opacity" values="0;0;0;0;0;1;1;1;0" dur="12s" repeatCount="indefinite" begin="0s"/>
      </text>

      <!-- Cursor -->
      <rect x="625" y="145" width="2" height="16" fill="#06B6D4" filter="url(#glowLight)">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Info Section -->
    <g>
      <text x="510" y="210" font-family="monospace" font-size="11" fill="#64748B">$ whoami</text>

      <!-- Location -->
      <text x="510" y="235" font-family="monospace" font-size="11" fill="#94A3B8">📍 Location</text>
      <text x="550" y="235" font-family="monospace" font-size="11" fill="#0F172A">India</text>

      <!-- Education -->
      <text x="510" y="260" font-family="monospace" font-size="11" fill="#94A3B8">🎓 Education</text>
      <text x="550" y="260" font-family="monospace" font-size="11" fill="#0F172A">Full Stack Developer</text>

      <!-- Focus -->
      <text x="510" y="285" font-family="monospace" font-size="11" fill="#94A3B8">🎯 Focus</text>
      <text x="550" y="285" font-family="monospace" font-size="11" fill="#0F172A">Web3 & AI</text>
    </g>

    <!-- Skills Section -->
    <text x="510" y="330" font-family="monospace" font-size="11" fill="#64748B">$ skills --list</text>

    <!-- Skill Pills with hover effect -->
    <g id="skillsLight">
      <!-- React -->
      <g>
        <rect x="510" y="345" width="80" height="28" rx="14" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="stroke" values="rgba(6,182,212,0.3);rgba(6,182,212,0.6);rgba(6,182,212,0.3)" dur="3s" repeatCount="indefinite"/>
        </rect>
        <text x="550" y="364" font-family="monospace" font-size="11" fill="#06B6D4" text-anchor="middle">React</text>
      </g>

      <!-- Next.js -->
      <g>
        <rect x="605" y="345" width="80" height="28" rx="14" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite" begin="0.3s"/>
          <animate attributeName="stroke" values="rgba(37,99,235,0.3);rgba(37,99,235,0.6);rgba(37,99,235,0.3)" dur="3s" repeatCount="indefinite" begin="0.3s"/>
        </rect>
        <text x="645" y="364" font-family="monospace" font-size="11" fill="#2563EB" text-anchor="middle">Next.js</text>
      </g>

      <!-- Node.js -->
      <g>
        <rect x="700" y="345" width="80" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite" begin="0.6s"/>
          <animate attributeName="stroke" values="rgba(16,185,129,0.3);rgba(16,185,129,0.6);rgba(16,185,129,0.3)" dur="3s" repeatCount="indefinite" begin="0.6s"/>
        </rect>
        <text x="740" y="364" font-family="monospace" font-size="11" fill="#10B981" text-anchor="middle">Node.js</text>
      </g>

      <!-- TypeScript -->
      <g>
        <rect x="510" y="385" width="80" height="28" rx="14" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite" begin="0.9s"/>
          <animate attributeName="stroke" values="rgba(6,182,212,0.3);rgba(6,182,212,0.6);rgba(6,182,212,0.3)" dur="3s" repeatCount="indefinite" begin="0.9s"/>
        </rect>
        <text x="550" y="404" font-family="monospace" font-size="11" fill="#06B6D4" text-anchor="middle">TypeScript</text>
      </g>

      <!-- Tailwind -->
      <g>
        <rect x="605" y="385" width="80" height="28" rx="14" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite" begin="1.2s"/>
          <animate attributeName="stroke" values="rgba(37,99,235,0.3);rgba(37,99,235,0.6);rgba(37,99,235,0.3)" dur="3s" repeatCount="indefinite" begin="1.2s"/>
        </rect>
        <text x="645" y="404" font-family="monospace" font-size="11" fill="#2563EB" text-anchor="middle">Tailwind</text>
      </g>

      <!-- Docker -->
      <g>
        <rect x="700" y="385" width="80" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite" begin="1.5s"/>
          <animate attributeName="stroke" values="rgba(16,185,129,0.3);rgba(16,185,129,0.6);rgba(16,185,129,0.3)" dur="3s" repeatCount="indefinite" begin="1.5s"/>
        </rect>
        <text x="740" y="404" font-family="monospace" font-size="11" fill="#10B981" text-anchor="middle">Docker</text>
      </g>
    </g>

    <!-- Social Icons -->
    <g>
      <text x="510" y="465" font-family="monospace" font-size="11" fill="#64748B">$ connect --social</text>

      <!-- GitHub -->
      <g>
        <circle cx="535" cy="495" r="16" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="r" values="16;18;16" dur="2s" repeatCount="indefinite" begin="0s"/>
        </circle>
        <text x="535" y="502" font-family="Arial" font-size="16" fill="#06B6D4" text-anchor="middle">gh</text>
      </g>

      <!-- LinkedIn -->
      <g>
        <circle cx="580" cy="495" r="16" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="r" values="16;18;16" dur="2s" repeatCount="indefinite" begin="0.3s"/>
        </circle>
        <text x="580" y="502" font-family="Arial" font-size="16" fill="#2563EB" text-anchor="middle">in</text>
      </g>

      <!-- Twitter -->
      <g>
        <circle cx="625" cy="495" r="16" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="r" values="16;18;16" dur="2s" repeatCount="indefinite" begin="0.6s"/>
        </circle>
        <text x="625" y="502" font-family="Arial" font-size="16" fill="#10B981" text-anchor="middle">tw</text>
      </g>

      <!-- Portfolio -->
      <g>
        <circle cx="670" cy="495" r="16" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" filter="url(#glowLight)">
          <animate attributeName="r" values="16;18;16" dur="2s" repeatCount="indefinite" begin="0.9s"/>
        </circle>
        <text x="670" y="502" font-family="Arial" font-size="14" fill="#06B6D4" text-anchor="middle">→</text>
      </g>
    </g>

    <!-- Bottom accent line -->
    <line x1="510" y1="530" x2="1080" y2="530" stroke="url(#accentGradientLight)" stroke-width="1.5" opacity="0.15" filter="url(#glowLight)">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Outer Border Shimmer -->
  <rect x="10" y="10" width="1160" height="590" rx="20" fill="none" stroke="url(#accentGradientLight)" stroke-width="1.5" opacity="0.2" filter="url(#glowLight)">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;2;1.5" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>